name: miniHawk waterbox core

# The core as miniHawk ships it: a sandboxed core.wbx package.
#
# Both jobs run only over roms that are FREE TO DISTRIBUTE and vendored in this repository, so they
# need nothing provisioned and can run on public runners.

on:
  pull_request:
    branches: [ "main" ]
    paths: [ "waterbox/**", "source/**", ".github/workflows/minihawk.yml" ]
  push:
    branches: [ "main" ]
    paths: [ "waterbox/**", "source/**", ".github/workflows/minihawk.yml" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. The nightly schedule and a push to
# main are the same workflow on the same ref, so without the event in the key
# whichever starts second cancels the first - and because the publish depends
# on the gate that was cancelled, the release is skipped with nothing anywhere
# reporting a failure. They collide at all because GitHub runs these crons
# hours late: this one asks for 04:00 and starts around 08:30. A push still
# supersedes an older push on the same ref, which is what cancel-in-progress
# is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  MINIHAWK_REF: main

jobs:

  core-gate:
    # The fast half: the sandboxed core must emulate byte-identically to the same sources built for
    # the host, and survive a savestate round-trip around every frame. No .NET, Mono or X involved.
    name: core gate (equivalence + savestates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Check out miniHawk (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.MINIHAWK_REF }}
          path: minihawk-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Check out miniBox
        working-directory: minihawk-checkout
        run: git submodule update --init extern/chimera-common-minibox

      # The C++ guest toolchain (musl + libstdc++ built for the sandbox) is the slow part of the
      # build and changes only when miniBox does.
      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: minihawk-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('minihawk-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('minihawk-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/minihawk-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the native reference and the sandbox drivers
        run: |
          mb="$PWD/minihawk-checkout/extern/chimera-common-minibox"
          meson setup build/meson-native "-Dminibox_dir=$mb"
          ninja -C build/meson-native

      - name: Build the waterbox core
        run: |
          mb="$PWD/minihawk-checkout/extern/chimera-common-minibox"
          sh waterbox/setup-guest.sh -m "$mb"
          ninja -C build/meson-guest core.wbx

      - name: Core gate over the free-to-distribute roms
        run: ./waterbox/run-gate.sh

      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx
          path: |
            waterbox/bin/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-gate:
    # The other half: the package running inside the real frontend (EmuHawk headless under Mono +
    # Xvfb, loading it through miniHawk's generic waterbox adapter). The emulated RAM must match the
    # native reference, and sync settings must reach the guest. Builds all of miniHawk, so it takes
    # minutes; the core gate gives fast feedback meanwhile.
    name: frontend gate (miniHawk)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Check out miniHawk
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.MINIHAWK_REF }}
          path: minihawk-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 \
            mono-complete xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build miniHawk native dependencies
        working-directory: minihawk-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the miniHawk solution
        working-directory: minihawk-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: minihawk-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('minihawk-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('minihawk-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/minihawk-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the native reference (the gate's comparison side)
        run: |
          mb="$PWD/minihawk-checkout/extern/chimera-common-minibox"
          meson setup build/meson-native "-Dminibox_dir=$mb"
          ninja -C build/meson-native run-native

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one that
        # publishes the artifact, so what it stamps is what a movie can cite. A package
        # built by hand stamps "+local" instead and can never be mistaken for this one.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -r "$PWD/minihawk-checkout"

      - name: Frontend gate
        run: ./waterbox/tests/run-frontend.sh --minihawk-root "$GITHUB_WORKSPACE/minihawk-checkout"

      - name: Publish the core package
        # Only from a gate that passed: an artifact nobody vouched for is worse than
        # no artifact. The version inside it is the commit above.
        uses: actions/upload-artifact@v7
        with:
          name: quickerneshawk-${{ github.sha }}
          path: minihawk-checkout/build/Cores/quickerneshawk.chimeraCore
          if-no-files-found: error

      - name: Upload the frontend work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work
          path: waterbox/tests/work/

  publish:
    # What the gates passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run. Chimera ships no cores; its Core Manager downloads
    # them from here.
    #
    # The logic is Chimera's tools/publish-core.sh, called through one reusable
    # workflow, so all fifteen cores publish the same way and there is one place
    # to change it.
    name: publish
    needs: [ core-gate, frontend-gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: quickerneshawk
      artifact: quickerneshawk-${{ github.sha }}
      package: quickerneshawk.chimeraCore
      kind: ${{ github.event.inputs.kind }}
